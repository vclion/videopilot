<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="跨平台视频下载工具，粘贴链接即可保存高清视频或 MP3 音频。"
    />
    <title>视频下载助手 - 粘贴链接，马上保存</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="nav-inner">
          <a class="brand" href="#top" aria-label="视频下载助手首页">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Z" fill="currentColor" opacity=".18"/>
                <path d="m10 8 5 4-5 4V8Z" fill="currentColor"/>
              </svg>
            </span>
            <span class="brand-name">视频下载助手</span>
          </a>


        </div>
      </header>

      <main id="top">
        <section class="hero">
          <div class="hero-blob hero-blob-one" aria-hidden="true"></div>
          <div class="hero-blob hero-blob-two" aria-hidden="true"></div>
          <div class="hero-grid" aria-hidden="true"></div>

          <div class="hero-content">
            <div class="eyebrow">
              <span class="eyebrow-dot"></span>
              基于 yt-dlp · 支持 1000+ 内容平台
            </div>
            <h1 class="hero-title">粘贴链接，<br /><span class="hero-title-accent">马上保存</span>你喜欢的内容</h1>
            <p class="hero-subtitle">
              无需安装、无需登录，手机电脑都能用。高清 MP4、纯净 MP3，一次搞定。
            </p>

            <div class="search-panel" id="downloader">
              <form id="parse-form" class="search-form">
                <div class="input-wrap">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="m21 21-4.35-4.35m1.35-5.15a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                  </svg>
                  <input
                    id="url-input"
                    name="url"
                    type="text"
                    inputmode="url"
                    autocomplete="url"
                    placeholder="粘贴链接，或直接粘贴分享文本"
                    required
                  />
                  <button class="paste-btn" id="paste-btn" type="button">粘贴</button>
                </div>
                <button class="primary-btn" id="parse-btn" type="submit">
                  <span class="btn-label">解析视频</span>
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </form>
              <p class="search-hint">支持公开且你有权下载的内容，请勿用于侵权用途</p>
            </div>

            <div class="platforms" id="platforms">
              <span class="platforms-label">热门平台</span>
              <div class="platform-chips" id="platform-chips"></div>
            </div>


          </div>
        </section>

        <section class="content-section">
          <div class="loading-card is-hidden" id="parse-loading">
            <div class="spinner"></div>
            <div>
              <strong>正在读取视频信息</strong>
              <p>平台不同，解析速度会有差异，请稍候</p>
            </div>
          </div>

          <article class="result-card is-hidden" id="result-card">
            <div class="result-preview">
              <img id="result-thumb" alt="视频封面" referrerpolicy="no-referrer" />
              <div class="preview-fallback" id="preview-fallback">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Z" fill="currentColor" opacity=".16"/>
                  <path d="m10 8 5 4-5 4V8Z" fill="currentColor"/>
                </svg>
              </div>
            </div>
            <div class="result-info">
              <div class="result-badge" id="result-platform">视频</div>
              <h2 id="result-title">视频标题</h2>
              <p class="result-meta" id="result-meta"></p>

              <div class="format-block">
                <div class="segment-tabs" id="format-tabs">
                  <button class="segment active" data-kind="video" type="button">视频 MP4</button>
                  <button class="segment" data-kind="audio" type="button">音频 MP3</button>
                </div>
                <div class="quality-options" id="quality-options"></div>
              </div>

              <div class="result-actions">
                <button class="primary-btn download-btn" id="download-btn" type="button">
                  <span class="btn-label">下载视频</span>
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 4v12m0 0 5-5m-5 5-5-5M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <button class="ghost-btn audio-download-btn" id="audio-download-btn" type="button">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
                    <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2"/>
                  </svg>
                  <span class="btn-label">仅下载 MP3</span>
                </button>
              </div>
            </div>
          </article>

          <article class="progress-card is-hidden" id="progress-card">
            <div class="progress-head">
              <div>
                <span class="status-pill" id="task-status">准备中</span>
                <h2 id="progress-title">正在下载</h2>
              </div>
              <span class="progress-percent" id="progress-percent">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-stats" id="progress-stats"></div>
            <a class="download-link is-hidden" id="download-link" href="#">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 4v12m0 0 5-5m-5 5-5-5M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              保存到本地
            </a>
          </article>

          <section class="history-section" id="history">
            <div class="section-heading">
              <div>
                <p class="section-kicker">RECENT</p>
                <h2>最近下载</h2>
              </div>
              <button class="ghost-btn" id="refresh-history" type="button">刷新记录</button>
            </div>
            <div class="history-list" id="history-list"></div>
            <div class="empty-history is-hidden" id="empty-history">
              还没有下载记录，粘贴一个链接开始体验吧。
            </div>
          </section>
        </section>
      </main>

      <footer class="footer">
        <div class="footer-inner">
          <p>视频下载助手 · 轻量、快速、跨平台</p>
          <p class="footer-disclaimer">
            本站仅提供技术工具，请下载你有权保存的公开内容，并遵守平台条款与当地法律。
          </p>
        </div>
      </footer>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <script src="/app.js" defer></script>
  </body>
</html>
